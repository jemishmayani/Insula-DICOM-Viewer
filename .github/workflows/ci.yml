name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push cancels an older run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach APKs to releases on version tags

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_RELEASE_KEY: ${{ secrets.INSULA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk-headless android-sdk-platform-23 aapt dalvik-exchange apksigner zipalign libegl1 libgl1-mesa-dri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.INSULA_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.INSULA_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.INSULA_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export INSULA_KEYSTORE="$RUNNER_TEMP/release.jks"
            export INSULA_KEYSTORE_PASS="$KEYSTORE_PASS"
            export INSULA_KEY_ALIAS="${KEY_ALIAS:-insula}"
            echo "Signing with the release key from repository secrets."
          else
            echo "No release key configured; signing with a temporary debug key."
          fi
          ./build.sh

      - name: Run tests
        run: tests/run_tests.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InsulaDICOMViewer-apk
          path: out/InsulaDICOMViewer-v*.apk

      - name: Upload test renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          # MPR renders, plus 3D comparison images (CPU left, GPU shader right), written only when the shader ran
          path: |
            tests/.work/*.png
            tests/.work/vrt/compare_*.png
            tests/.work/vrt/gpu_result.txt
          if-no-files-found: ignore

      - name: Attach APK to release
        # Only publish releases signed with your own key, so users can install updates over them.
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: out/InsulaDICOMViewer-v*.apk
          generate_release_notes: true

  # Publishes a release APK that was built and signed outside CI (kept on the release-binaries branch),
  # for when the signing key isn't stored in repository secrets. Runs only for version tags, after tests pass.
  publish-prebuilt:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HAS_RELEASE_KEY: ${{ secrets.INSULA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prebuilt APK
        if: env.HAS_RELEASE_KEY != 'true'
        uses: actions/checkout@v4
        with:
          ref: release-binaries
          path: rb

      - name: Verify signature and version
        if: env.HAS_RELEASE_KEY != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq apksigner aapt >/dev/null
          V="${GITHUB_REF_NAME#v}"
          APK="rb/InsulaDICOMViewer-v$V.apk"
          [ -f "$APK" ] || { echo "No $APK on the release-binaries branch"; exit 1; }
          apksigner verify "$APK"
          CERT=$(apksigner verify --print-certs "$APK" | grep "SHA-256 digest" | head -1 | awk '{print $NF}')
          WANT=$(tr -d '[:space:]' < .github/release-signing-cert.sha256)
          [ "$CERT" = "$WANT" ] || { echo "Signing certificate $CERT doesn't match the release key $WANT"; exit 1; }
          GOT=$(aapt dump badging "$APK" | grep -o "versionName='[^']*'" | cut -d"'" -f2)
          [ "$GOT" = "$V" ] || { echo "APK version $GOT doesn't match tag $V"; exit 1; }
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          { [ -f "rb/notes/v$V.md" ] && cat "rb/notes/v$V.md"; echo; echo "**SHA-256** of \`InsulaDICOMViewer-v$V.apk\`: \`$SUM\`"; } > release-body.md
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Verified $APK: version $GOT, certificate $CERT"

      - name: Publish release
        if: env.HAS_RELEASE_KEY != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Insula DICOM Viewer ${{ github.ref_name }}
          body_path: release-body.md
          files: ${{ env.APK }}
          make_latest: true
